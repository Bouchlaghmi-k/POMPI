services:
  pompi-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pompi-app
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pompi
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: pompi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pompi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pompi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pompi"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    container_name: pompi-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - pompi-app

  grafana:
    image: grafana/grafana:latest
    container_name: pompi-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - pompi_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pompi_postgres_data:
  pompi_grafana_data: